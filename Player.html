

<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I CAN Yoga - Övning</title>

    <link rel="stylesheet" href="Player.css">
</head>

<body>

    <header class="header">
        <h1>🌿 I CAN Yoga</h1>
    </header>

    <main class="player-page">

        <button class="back-button" id="back-button">
            ← Tillbaka till övningarna
        </button>

        <section class="exercise-info">

            <p class="category" id="exercise-category">
                ANDNING
            </p>

            <h2 id="exercise-title">
                Styrkeandning
            </h2>

            <p class="duration" id="exercise-duration">
                2 minuter
            </p>

            <p class="description" id="exercise-description">
                Andning kombinerad med mjuka handrörelser.
            </p>

        </section>

        <section class="video-card">

            <video id="exercise-video" controls>
                <source src="" type="video/mp4">
                Din webbläsare stöder inte videouppspelning.
            </video>

            <div class="subtitle-info">
                <h3>Undertexter</h3>
                <p>Svenska undertexter visas här när de finns tillgängliga.</p>
            </div>

            <button id="download-button" class="download-button">
                Ladda ner övningen
            </button>

        </section>

    </main>

    <script src="Player.js"></script>

</body>
</html>
