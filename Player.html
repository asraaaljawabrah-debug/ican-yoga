

<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>I CAN Yoga - Övning</title>

    <link rel="stylesheet" href="Player.css">
    <link rel="stylesheet" href="/src/integration/integration.css">
</head>

<body>

    <header class="header">
        <h1>🌿 I CAN Yoga</h1>
    </header>

    <main class="player-page">

        <button type="button" class="back-button" id="back-button">
            ← Tillbaka
        </button>

        <p id="player-status" class="status-message" role="status">Läser övningen…</p>
        <section class="exercise-info">

            <p class="category" id="exercise-category">
                
            </p>

            <h2 id="exercise-title">
                Övning
            </h2>

            <p class="duration" id="exercise-duration">
                
            </p>

            <p class="description" id="exercise-description">
                
            </p>

        </section>

        <section class="video-card">

            <video id="exercise-video" controls playsinline preload="metadata" crossorigin="anonymous" hidden>
                Din webbläsare stöder inte videouppspelning.
            </video>

            <div class="subtitle-info" hidden>
                <p id="subtitle-status" role="status"></p>
                <button type="button" id="captions-button" class="secondary-button" aria-pressed="false" hidden>Visa undertexter</button>
            </div>

            <p id="source-status" class="status-message"></p>
            <progress id="download-progress" max="100" aria-label="Nedladdningsförlopp" hidden></progress>
            <div class="player-actions">
                <button type="button" id="download-button" class="download-button" disabled>Ladda ned</button>
                <button type="button" id="remove-button" class="secondary-button" hidden>Ta bort</button>
            </div>

        </section>

    </main>

    <script type="module" src="/src/integration/player-page.js"></script>

</body>
</html>
